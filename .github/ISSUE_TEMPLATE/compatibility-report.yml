name: Compatibility report
description: Tell others whether the patched PHP 7.4 works on your Synology
title: "[Report] "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Reports from other models are how this project learns what works.

        The quickest way to fill this in: open `test-site/index.php` on your NAS and click
        **"Report on GitHub"** at the bottom – it pre-fills the model, DSM version and results.
        Please check that nothing private (IP addresses, user names, passwords) is in the text.

  - type: input
    id: model
    attributes:
      label: NAS model
      placeholder: DS1815+
    validations:
      required: true

  - type: input
    id: dsm
    attributes:
      label: DSM version
      placeholder: 6.2.4-25556 Update 7
    validations:
      required: true

  - type: input
    id: cpu
    attributes:
      label: CPU (optional)
      placeholder: Intel(R) Atom(TM) CPU C2538 @ 2.40GHz

  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works – install OK, websites OK
        - Works, with problems (please describe below)
        - Does not work – install.sh stopped or I rolled back
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: Test page report
      description: Copied from the test page ("Share your result" section).
      render: text

  - type: textarea
    id: install_output
    attributes:
      label: install.sh output (optional)
      description: Especially useful if something failed.
      render: shell

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Web Station setup (Nginx/Apache, PHP profile), database (MariaDB 5/10), apps you run (WordPress, Nextcloud, …), anything unusual.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I checked that this report contains no passwords, private IP addresses or other sensitive data.
          required: true
